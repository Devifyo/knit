services:
  # ---- PHP-FPM application (serves HTTP via nginx) ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knit_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: >
      sh -c "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs bootstrap/cache &&
             chmod -R 777 storage bootstrap/cache 2>/dev/null;
             supervisord -c /etc/supervisord.conf"
    networks: [knit]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # ---- Horizon (Redis-backed queue workers) ----
  horizon:
    build: { context: ., dockerfile: Dockerfile }
    container_name: knit_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["php", "artisan", "horizon"]
    networks: [knit]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # ---- Scheduler (runs due scheduled tasks: workflow delays, AI jobs, etc.) ----
  scheduler:
    build: { context: ., dockerfile: Dockerfile }
    container_name: knit_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    entrypoint: ["php", "artisan", "schedule:work"]
    networks: [knit]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  # ---- Reverb WebSocket server ----
  reverb:
    build: { context: ., dockerfile: Dockerfile }
    container_name: knit_reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: 6001
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=6001"]
    ports:
      - "8102:6001"
    networks: [knit]
    depends_on:
      redis: { condition: service_started }

  # ---- Vite dev server (HMR) ----
  vite:
    image: node:24-alpine
    container_name: knit_vite
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    networks: [knit]

  # ---- Nginx ----
  nginx:
    image: nginx:alpine
    container_name: knit_web
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8100:80"
    networks: [knit]
    depends_on: [app]

  # ---- MySQL (latest) ----
  db:
    image: mysql:latest
    container_name: knit_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - knit_db_data:/var/lib/mysql
    ports:
      - "33062:3306"
    networks: [knit]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- Redis ----
  redis:
    image: redis:alpine
    container_name: knit_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - knit_redis_data:/data
    networks: [knit]

  # ---- phpMyAdmin ----
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: knit_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 100M
    ports:
      - "8101:80"
    networks: [knit]
    depends_on: [db]

volumes:
  knit_db_data:
  knit_redis_data:

networks:
  knit:
    name: knit_default
    driver: bridge
