name: CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

jobs:
  quality:
    name: Pint · PHPStan · Pest
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: knit_secret
          MYSQL_DATABASE: knit_test
          MYSQL_USER: knit
          MYSQL_PASSWORD: knit_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pknit_secret"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      # Override .env.testing's container hostnames for the CI network.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: knit_test
      DB_USERNAME: knit
      DB_PASSWORD: knit_secret
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_mysql, redis, gd, zip, pcntl, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Lint (Pint)
        run: composer lint:test

      - name: Static analysis (PHPStan level 6)
        run: composer analyse

      - name: Tests (Pest)
        run: php artisan test
